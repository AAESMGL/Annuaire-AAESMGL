<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annuaire — AAESM GL</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f1e3c;
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --cream: #f8f5ee;
    --white: #ffffff;
    --slate: #4a5568;
    --slate-light: #718096;
    --border: #e2d9c8;
    --shadow: 0 4px 24px rgba(15,30,60,0.10);
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--navy); min-height: 100vh; }

  /* HEADER */
  header {
    background: var(--navy); color: var(--white);
    padding: 0 1.5rem; display: flex; align-items: center; gap: 1.2rem;
    height: 72px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }
  #logo-container {
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center;
    background: var(--white); flex-shrink: 0; overflow: hidden;
  }
  #logo-container img { width: 100%; height: 100%; object-fit: contain; }
  #logo-placeholder { font-size: 1.2rem; font-weight: 900; color: var(--navy); font-family: 'Playfair Display', serif; }
  .header-text h1 { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
  .header-text p { font-size: 0.68rem; color: var(--gold-light); font-weight: 300; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 0.1rem; }
  .header-right { margin-left: auto; display: flex; gap: 1.5rem; align-items: center; }
  .stat-pill { text-align: center; }
  .stat-pill span:first-child { display: block; font-size: 1.3rem; font-weight: 700; font-family: 'Playfair Display', serif; color: var(--gold); }
  .stat-pill span:last-child { font-size: 0.68rem; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.05em; }

  /* SYNC */
  #sync-status { display: flex; align-items: center; gap: 0.4rem; font-size: 0.72rem; color: rgba(255,255,255,0.6); white-space: nowrap; }
  #sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; flex-shrink: 0; transition: background 0.3s; }
  #sync-dot.ok { background: #34d399; }
  #sync-dot.loading { background: var(--gold); animation: pulse 1s infinite; }
  #sync-dot.error { background: #f87171; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* LECTURE SEULE BADGE */
  .readonly-badge {
    background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.4);
    color: var(--gold-light); border-radius: 20px;
    padding: 0.2rem 0.7rem; font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
  }

  /* LAYOUT */
  .container { max-width: 100%; padding: 1.5rem; }

  /* TOOLBAR */
  .toolbar { display: flex; gap: 0.7rem; margin-bottom: 1.2rem; flex-wrap: wrap; align-items: center; }
  .search-box { flex: 1; min-width: 180px; position: relative; }
  .search-box input {
    width: 100%; padding: 0.65rem 1rem 0.65rem 2.5rem;
    border: 2px solid var(--border); border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 0.88rem;
    background: var(--white); color: var(--navy); transition: border-color 0.2s;
  }
  .search-box input:focus { outline: none; border-color: var(--gold); }
  .search-box svg { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--slate-light); pointer-events: none; }
  select {
    padding: 0.65rem 0.9rem; border: 2px solid var(--border); border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
    background: var(--white); color: var(--navy); cursor: pointer; transition: border-color 0.2s;
  }
  select:focus { outline: none; border-color: var(--gold); }
  .btn {
    padding: 0.65rem 1.1rem; border-radius: 8px; border: none;
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 0.4rem;
    transition: all 0.2s; white-space: nowrap;
  }
  .btn-secondary { background: var(--white); color: var(--navy); border: 2px solid var(--border); }
  .btn-secondary:hover { border-color: var(--gold); }

  /* PROMO BADGES */
  .promo-badges-container { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); padding: 0.9rem 1.1rem; margin-bottom: 1.2rem; }
  .promo-badges-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--slate-light); margin-bottom: 0.5rem; }
  .promo-badge { display: inline-block; background: var(--navy); color: var(--gold); padding: 0.15rem 0.55rem; border-radius: 20px; font-size: 0.76rem; font-weight: 700; font-family: 'Playfair Display', serif; margin: 0.15rem; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; }
  .promo-badge:hover { border-color: var(--gold); }
  .promo-badge.active { background: var(--gold); color: var(--navy); }

  /* BADGES */
  .badge-actif { display:inline-block; background:#d1fae5; color:#065f46; padding:0.15rem 0.5rem; border-radius:20px; font-size:0.74rem; font-weight:600; }
  .badge-retraite { display:inline-block; background:#e0e7ff; color:#3730a3; padding:0.15rem 0.5rem; border-radius:20px; font-size:0.74rem; font-weight:600; }

  /* TABLE */
  .table-wrapper { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 760px; }
  thead { background: var(--navy); color: var(--white); }
  th { padding: 0.85rem 0.9rem; text-align: left; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap; cursor: pointer; user-select: none; transition: background 0.15s; }
  th:hover { background: rgba(201,168,76,0.2); }
  th .sort-icon { opacity: 0.4; margin-left: 3px; }
  th.sorted .sort-icon { opacity: 1; color: var(--gold); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; animation: rowIn 0.25s ease both; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #faf8f3; }
  @keyframes rowIn { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }
  td { padding: 0.75rem 0.9rem; font-size: 0.85rem; color: var(--slate); vertical-align: middle; }
  td.name-cell { font-weight: 600; color: var(--navy); }
  td.promo-cell { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--gold); font-size: 0.95rem; }
  .empty-state { text-align: center; padding: 3rem 2rem; color: var(--slate-light); }
  .empty-state svg { opacity: 0.3; margin-bottom: 0.8rem; display: block; margin-left: auto; margin-right: auto; }

  /* CARDS MOBILE */
  .cards-list { display: none; flex-direction: column; gap: 0.8rem; }
  .member-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 1rem 1.1rem; animation: rowIn 0.25s ease both; }
  .card-top { margin-bottom: 0.6rem; }
  .card-name { font-weight: 700; font-size: 1rem; color: var(--navy); line-height: 1.2; }
  .card-promo { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--gold); font-size: 0.88rem; margin-top: 0.15rem; }
  .card-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem; font-size: 0.82rem; }
  .card-field .lbl { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--slate-light); display: block; margin-bottom: 0.1rem; }
  .card-field a { color: var(--gold); text-decoration: none; word-break: break-all; }
  .card-field.full { grid-column: 1 / -1; }

  /* PAGINATION */
  .pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 1rem; flex-wrap: wrap; gap: 0.6rem; }
  .page-info { font-size: 0.82rem; color: var(--slate-light); }
  .page-buttons { display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .page-btn { width: 32px; height: 32px; border-radius: 7px; border: 2px solid var(--border); background: var(--white); font-family: 'DM Sans', sans-serif; font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; color: var(--navy); }
  .page-btn:hover:not(:disabled) { border-color: var(--gold); }
  .page-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .page-btn:disabled { opacity: 0.35; cursor: default; }

  /* LOADING */
  #loading-screen { position: fixed; inset: 0; background: var(--navy); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; gap: 1.2rem; transition: opacity 0.4s; }
  #loading-screen.hidden { opacity: 0; pointer-events: none; }
  .loading-logo { font-family: 'Playfair Display', serif; font-size: 3rem; font-weight: 900; color: var(--gold); }
  .loading-text { color: rgba(255,255,255,0.7); font-size: 0.9rem; }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(201,168,76,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* TOAST */
  #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--navy); color: var(--white); padding: 0.75rem 1.2rem; border-radius: 10px; font-size: 0.86rem; font-weight: 500; box-shadow: 0 8px 30px rgba(0,0,0,0.2); border-left: 4px solid var(--gold); transform: translateY(20px); opacity: 0; transition: all 0.3s ease; z-index: 999; pointer-events: none; max-width: calc(100vw - 3rem); }
  #toast.show { transform: none; opacity: 1; }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    header { padding: 0 1rem; gap: 0.9rem; height: 64px; }
    .header-text h1 { font-size: 0.88rem; }
    .header-right { gap: 0.8rem; }
    .stat-pill { display: none; }
    #sync-status span:last-child { display: none; }
    .container { padding: 0.9rem; }
    .toolbar select { display: none; }
    .table-wrapper { display: none; }
    .cards-list { display: flex; }
    #toast { bottom: 0.8rem; right: 0.8rem; left: 0.8rem; }
  }
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading-screen">
  <div class="loading-logo">AAESM</div>
  <div class="spinner"></div>
  <div class="loading-text">Chargement de l'annuaire…</div>
</div>

<header>
  <div id="logo-container">
    <span id="logo-placeholder">AE</span>
  </div>
  <div class="header-text">
    <h1>Association des Anciens Élèves de Sainte Marie Grand Lebrun</h1>
    <p>Annuaire des membres</p>
  </div>
  <div class="header-right">
    <span class="readonly-badge">👁 Consultation</span>
    <div id="sync-status">
      <div id="sync-dot"></div>
      <span id="sync-text">Connexion…</span>
    </div>
    <div class="stat-pill"><span id="stat-total">0</span><span>membres</span></div>
    <div class="stat-pill"><span id="stat-promos">0</span><span>promotions</span></div>
  </div>
</header>

<div class="container">

  <div class="promo-badges-container" id="promo-badges-section" style="display:none">
    <div class="promo-badges-title">Filtrer par promotion</div>
    <div id="promo-badges"></div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Rechercher nom, prénom, email…">
    </div>
    <select id="sort-select">
      <option value="nom">Trier : Nom A→Z</option>
      <option value="prenom">Trier : Prénom A→Z</option>
      <option value="promotion">Trier : Promotion (récent)</option>
      <option value="promotion-asc">Trier : Promotion (ancien)</option>
    </select>
    <button class="btn btn-secondary" onclick="loadMembers()" title="Actualiser">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Actualiser
    </button>
  </div>

  <!-- TABLE desktop -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('nom')">Nom <span class="sort-icon" id="sort-nom">▲</span></th>
          <th onclick="sortBy('prenom')">Prénom <span class="sort-icon" id="sort-prenom">▲</span></th>
          <th onclick="sortBy('promotion')">Promo <span class="sort-icon" id="sort-promotion">▲</span></th>
          <th>Email</th>
          <th>Téléphone</th>
          <th onclick="sortBy('profession')">Profession <span class="sort-icon" id="sort-profession">▲</span></th>
          <th onclick="sortBy('statut')">Statut <span class="sort-icon" id="sort-statut">▲</span></th>
          <th>Adresse</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <!-- CARTES mobile -->
  <div class="cards-list" id="cards-list"></div>

  <div class="pagination" id="pagination"></div>
</div>

<div id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyQNbiQvsHkrUQmqcJB113Oo27SgRiIc2M9PyOZJenoOhfUwBUJOb4Qr4oN08BfMGkIUA/exec";

let members = [];
let currentSort = 'nom';
let sortAsc = true;
let currentPage = 1;
let filterPromo = null;
const PER_PAGE = 20;

// LOGO (lecture seule depuis localStorage)
if (localStorage.getItem('ae_logo')) showLogo(localStorage.getItem('ae_logo'));
function showLogo(src) {
  document.getElementById('logo-placeholder').style.display = 'none';
  const c = document.getElementById('logo-container');
  let img = c.querySelector('img');
  if (!img) { img = document.createElement('img'); c.insertBefore(img, c.firstChild); }
  img.src = src;
}

// SYNC STATUS
function setSyncStatus(state, text) {
  const dot = document.getElementById('sync-dot');
  dot.className = state;
  document.getElementById('sync-text').textContent = text;
}

// LOAD
async function loadMembers() {
  setSyncStatus('loading', 'Chargement…');
  try {
    const url = new URL(API_URL);
    url.searchParams.set('action', 'getAll');
    const res    = await fetch(url.toString());
    const result = await res.json();
    if (result.status === 'ok') {
      members = result.data || [];
      render();
      setSyncStatus('ok', 'À jour');
    } else throw new Error(result.message);
  } catch(e) {
    setSyncStatus('error', 'Erreur');
    toast('Impossible de charger l\'annuaire.', true);
  } finally {
    const ls = document.getElementById('loading-screen');
    if (!ls.classList.contains('hidden')) ls.classList.add('hidden');
  }
}

// SORT
function sortBy(field) {
  if (currentSort === field) sortAsc = !sortAsc;
  else { currentSort = field; sortAsc = field !== 'promotion'; }
  document.querySelectorAll('th').forEach(t => t.classList.remove('sorted'));
  const icon = document.getElementById('sort-' + field);
  if (icon) { icon.textContent = sortAsc ? '▲' : '▼'; icon.closest('th').classList.add('sorted'); }
  currentPage = 1; render();
}
document.getElementById('sort-select').addEventListener('change', e => {
  const v = e.target.value;
  if (v === 'promotion-asc') { currentSort = 'promotion'; sortAsc = true; }
  else { currentSort = v; sortAsc = v !== 'promotion'; }
  currentPage = 1; render();
});
document.getElementById('search').addEventListener('input', () => { currentPage = 1; render(); });
function setPromoFilter(promo) { filterPromo = filterPromo === promo ? null : promo; currentPage = 1; render(); }

// HELPERS
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function statutBadge(s) {
  if (s === 'actif')    return '<span class="badge-actif">Actif</span>';
  if (s === 'retraite') return '<span class="badge-retraite">Retraité</span>';
  if (s === 'decede')   return '<span style="display:inline-block;background:#f3f4f6;color:#6b7280;padding:0.15rem 0.5rem;border-radius:20px;font-size:0.74rem;font-weight:600">Décédé</span>';
  return '—';
}
function cotisationBadge(c) {
  if (!c) return '<span style="color:var(--slate-light);font-size:0.8rem">—</span>';
  const annee = parseInt(c);
  const now   = new Date().getFullYear();
  if (annee >= now)   return '<span style="display:inline-block;background:#d1fae5;color:#065f46;padding:0.15rem 0.55rem;border-radius:20px;font-size:0.74rem;font-weight:700">' + annee + ' ✓</span>';
  if (annee >= now-1) return '<span style="display:inline-block;background:#fef9c3;color:#854d0e;padding:0.15rem 0.55rem;border-radius:20px;font-size:0.74rem;font-weight:700">' + annee + ' ⚠</span>';
  return '<span style="display:inline-block;background:#fee2e2;color:#991b1b;padding:0.15rem 0.55rem;border-radius:20px;font-size:0.74rem;font-weight:700">' + annee + ' ✗</span>';
}

// FILTER + SORT
function getFiltered() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let data = [...members];
  if (filterPromo) data = data.filter(m => m.promotion == filterPromo);
  if (q) data = data.filter(m =>
    (m.nom||'').toLowerCase().includes(q) || (m.prenom||'').toLowerCase().includes(q) ||
    (m.email||'').toLowerCase().includes(q) || String(m.promotion||'').includes(q)
  );
  data.sort((a, b) => {
    let va = String(a[currentSort]||'').toLowerCase();
    let vb = String(b[currentSort]||'').toLowerCase();
    if (currentSort === 'promotion') { va = parseInt(a.promotion)||0; vb = parseInt(b.promotion)||0; }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
  return data;
}

// RENDER
function render() {
  const data   = getFiltered();
  const promos = [...new Set(members.map(m => m.promotion).filter(Boolean))].sort((a,b) => b-a);

  document.getElementById('stat-total').textContent  = members.length;
  document.getElementById('stat-promos').textContent = promos.length;

  const sec = document.getElementById('promo-badges-section');
  if (promos.length) {
    sec.style.display = '';
    document.getElementById('promo-badges').innerHTML =
      '<span class="promo-badge ' + (!filterPromo?'active':'') + '" onclick="setPromoFilter(null)">Toutes</span>' +
      promos.map(p => '<span class="promo-badge ' + (filterPromo==p?'active':'') + '" onclick="setPromoFilter(\'' + p + '\')">' + p + '</span>').join('');
  } else sec.style.display = 'none';

  const total  = data.length;
  const pages  = Math.max(1, Math.ceil(total / PER_PAGE));
  if (currentPage > pages) currentPage = pages;
  const start  = (currentPage - 1) * PER_PAGE;
  const slice  = data.slice(start, start + PER_PAGE);

  const emptyHTML = '<div class="empty-state"><svg width="44" height="44" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><p>' + (members.length===0?'Aucun membre.':'Aucun résultat.') + '</p></div>';

  // TABLE
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = !slice.length ? '<tr><td colspan="8">' + emptyHTML + '</td></tr>' :
    slice.map(m =>
      '<tr>' +
      '<td class="name-cell">' + esc((m.nom||'').toUpperCase()) + '</td>' +
      '<td>' + esc(m.prenom) + '</td>' +
      '<td class="promo-cell">' + esc(m.promotion) + '</td>' +
      '<td>' + (m.email ? '<a href="mailto:' + esc(m.email) + '" style="color:var(--gold);text-decoration:none">' + esc(m.email) + '</a>' : '—') + '</td>' +
      '<td>' + (m.telephone ? '<a href="tel:' + esc(m.telephone) + '" style="color:inherit;text-decoration:none">' + esc(m.telephone) + '</a>' : '—') + '</td>' +
      '<td>' + esc(m.profession||'—') + '</td>' +
      '<td>' + statutBadge(m.statut) + '</td>' +
      '<td style="max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + esc(m.adresse) + '">' + esc(m.adresse||'—') + '</td>' +
      '</tr>'
    ).join('');

  // CARTES MOBILE
  const cardsList = document.getElementById('cards-list');
  cardsList.innerHTML = !slice.length ? emptyHTML :
    slice.map(m =>
      '<div class="member-card">' +
        '<div class="card-top">' +
          '<div class="card-name">' + esc((m.nom||'').toUpperCase()) + ' ' + esc(m.prenom) + '</div>' +
          '<div class="card-promo">Promo ' + esc(m.promotion||'—') + '</div>' +
        '</div>' +
        '<div class="card-fields">' +
          (m.email ? '<div class="card-field full"><span class="lbl">Email</span><a href="mailto:' + esc(m.email) + '">' + esc(m.email) + '</a></div>' : '') +
          (m.telephone ? '<div class="card-field"><span class="lbl">Téléphone</span><a href="tel:' + esc(m.telephone) + '">' + esc(m.telephone) + '</a></div>' : '') +
          (m.statut ? '<div class="card-field"><span class="lbl">Statut</span>' + statutBadge(m.statut) + '</div>' : '') +
          (m.profession ? '<div class="card-field full"><span class="lbl">Profession</span>' + esc(m.profession) + '</div>' : '') +
          (m.adresse ? '<div class="card-field full"><span class="lbl">Adresse</span>' + esc(m.adresse) + '</div>' : '') +
        '</div>' +
      '</div>'
    ).join('');

  // PAGINATION
  const pag = document.getElementById('pagination');
  if (total <= PER_PAGE) { pag.innerHTML = '<span class="page-info">' + total + ' membre' + (total>1?'s':'') + '</span>'; return; }
  let html = '<span class="page-info">' + (start+1) + '–' + Math.min(start+PER_PAGE,total) + ' / ' + total + '</span><div class="page-buttons">';
  html += '<button class="page-btn" onclick="goPage(' + (currentPage-1) + ')" ' + (currentPage===1?'disabled':'') + '>‹</button>';
  for (let i=1; i<=pages; i++) {
    if (pages<=7 || Math.abs(i-currentPage)<=2 || i===1 || i===pages)
      html += '<button class="page-btn ' + (i===currentPage?'active':'') + '" onclick="goPage(' + i + ')">' + i + '</button>';
    else if (Math.abs(i-currentPage)===3)
      html += '<button class="page-btn" disabled>…</button>';
  }
  html += '<button class="page-btn" onclick="goPage(' + (currentPage+1) + ')" ' + (currentPage===pages?'disabled':'') + '>›</button></div>';
  pag.innerHTML = html;
}
function goPage(p) { currentPage = p; render(); window.scrollTo({top:0,behavior:'smooth'}); }

// TOAST
let toastTimer;
function toast(msg, isErr=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderLeftColor = isErr ? '#b83232' : 'var(--gold)';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// INIT
loadMembers();
</script>
